plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ampy.canonprint'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ampy.canonprint'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName 'rev2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
